service: webauthn-rails-demo

image: webauthn-rails-demo

servers:
  web:
    hosts:
      - 3.233.189.168
    options:
      memory: 200MiB

proxy:
  host: webauthn.cedarcode.com
  ssl: true
  app_port: 3000

registry:
  server: 864100757851.dkr.ecr.us-east-1.amazonaws.com
  username: AWS
  password: <%= %x(aws ecr get-login-password) %>

env:
  clear:
    RACK_ENV: production
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: enabled
    RAILS_SERVE_STATIC_FILES: enabled
    LANG: en_US.UTF-8
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL

accessories:
  db:
    image: postgres:17
    host: 3.233.189.168
    # Bind to loopback only; the app container reaches it over the Kamal network.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: webauthn
        POSTGRES_DB: webauthn_rails_demo_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

ssh:
  user: ubuntu

builder:
  arch: amd64
  cache:
    type: gha
